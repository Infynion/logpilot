name: Auto Release

on:
  push:
    branches:
      - main
      - master

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Fetch full history so we can detect existing tags globally
          fetch-depth: 0
          # Use a Personal Access Token (PAT) so the bot can bypass branch protection internally
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure Git User
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Determine Version and Auto-Bump
        id: version_bump
        run: |
          # Extract current version from plugin header
          CURRENT_VERSION=$(grep -E '^\s*\*\s*Version:' "logpilot.php" | awk '{print $3}')
          echo "Detected version in logpilot.php: $CURRENT_VERSION"
          
          # Check if remote already contains the tag
          if git ls-remote --tags origin "refs/tags/v$CURRENT_VERSION" | grep -q "refs/tags"; then
              echo "Tag v$CURRENT_VERSION already exists. Calculating next patch version..."
              
              # Extract major, minor, patch components
              IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"
              NEXT_PATCH=$((patch + 1))
              NEXT_VERSION="$major.$minor.$NEXT_PATCH"
              
              echo "Bumping version automatically to $NEXT_VERSION..."
              
              # Rewrite versions inside files
              sed -i "s/Version:     $CURRENT_VERSION/Version:     $NEXT_VERSION/g" logpilot.php
              sed -i "s/define( 'LOGPILOT_VERSION', '$CURRENT_VERSION' );/define( 'LOGPILOT_VERSION', '$NEXT_VERSION' );/g" logpilot.php
              sed -i "s/Stable tag: $CURRENT_VERSION/Stable tag: $NEXT_VERSION/g" readme.txt
              
              # Commit to main and skip hitting CI again
              git add logpilot.php readme.txt
              git commit -m "chore: auto-bump version to $NEXT_VERSION [skip ci]"
              git push origin HEAD
              
              echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          else
              echo "Tag v$CURRENT_VERSION does not exist yet. Bumping is not required."
              echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version_bump.outputs.version }}
        run: |
          echo "Publishing release for v$VERSION..."
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes
