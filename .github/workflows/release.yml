name: Auto Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Read Version from Plugin Header
        id: read_version
        run: |
          VERSION=$(grep -E '^\s*\*\s*Version:' "logpilot.php" | awk '{print $3}')

          if [ -z "$VERSION" ]; then
            echo "::error file=logpilot.php::Could not extract version from the plugin header."
            exit 1
          fi

          echo "Detected version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract Changelog for Version
        id: extract_changelog
        env:
          VERSION: ${{ steps.read_version.outputs.version }}
        run: |
          # ---------------------------------------------------------------
          # Extract the changelog block for the current version from
          # readme.txt. The block starts at "= x.x.x =" and ends just
          # before the next version entry "= x.x.x =" or end of file.
          # ---------------------------------------------------------------
          CHANGELOG=$(awk "
            /^= $VERSION =/ { found=1; next }
            found && /^= [0-9]+\.[0-9]+\.[0-9]+ =/ { exit }
            found && NF { print }
          " readme.txt)

          if [ -z "$CHANGELOG" ]; then
              echo "::warning::No changelog entry found for version $VERSION in readme.txt. Release notes will be empty."
              CHANGELOG="No changelog provided for this release."
          fi

          # ---------------------------------------------------------------
          # Format each non-empty line as a markdown bullet point,
          # stripping any leading "* " the author may have already added
          # to avoid double bullets in the output.
          # ---------------------------------------------------------------
          FORMATTED=$(echo "$CHANGELOG" | while IFS= read -r line; do
              line=$(echo "$line" | sed 's/^[[:space:]]*//')   # trim leading whitespace
              line=$(echo "$line" | sed 's/^\* *//')           # strip existing bullet if present
              [ -n "$line" ] && echo "- $line"
          done)

          # ---------------------------------------------------------------
          # Compose the final release notes body with a professional header
          # ---------------------------------------------------------------
          NOTES=$(printf "## 🚀 What's New in v%s\n\n%s\n\n---\n\n_For the full changelog, see [readme.txt](./readme.txt)._" \
              "$VERSION" "$FORMATTED")

          # Write to a temp file to safely pass multiline content between steps
          echo "$NOTES" > /tmp/release_notes.md
          cat /tmp/release_notes.md

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.read_version.outputs.version }}
        run: |
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q "refs/tags"; then
            echo "Tag v$VERSION already exists. Skipping release."
            exit 0
          fi

          echo "Publishing release for v$VERSION..."
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file /tmp/release_notes.md
